# Builds the desktop app and its installers natively on each OS, no cross-compiling: the installer script, AppImage
# and .deb on Linux, the NSIS installer on Windows. Each is smoke-tested, and the Windows installer is installed
# with the web server and uninstalled again. Runs on version tags (v1.2.3), where the files are also attached to
# the GitHub Release (any already there are kept), and on demand (workflow_dispatch) as run artifacts only.
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install root tools (Playwright drives the smoke test)
        working-directory: .
        run: npm ci
      - run: npm ci
      - name: Build (version taken from the tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        # GitHub expressions have no substring(): strip the leading "v" in the shell
        run: npm run dist -- "--config.extraMetadata.version=${GITHUB_REF_NAME#v}"
      - name: Build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist
      - name: Smoke-test the built app
        working-directory: .
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run desktop:test -- --packaged
          else npm run desktop:test -- --packaged; fi
      - name: Install and uninstall with the web server (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: ./installer/windows/test-installer.ps1
      - name: Install, serve and uninstall (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        shell: bash
        run: |
          sh dist/davinci-*-linux-x64-setup.sh --app
          ~/.local/bin/davinci --serve --port 8795 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8795/ | grep -q '<title>DaVinci</title>' && break; sleep 1; done
          curl -fsS http://127.0.0.1:8795/ | grep -q '<title>DaVinci</title>'
          kill %1
          sh ~/.local/share/davinci/uninstall.sh
          test ! -e ~/.local/bin/davinci && test ! -e ~/.local/share/davinci && test ! -e ~/.local/share/applications/davinci.desktop
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*-setup.sh
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only this job may create the release and upload to it
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Create the release (if needed) and attach the files it does not have yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "DaVinci ${TAG#v}" --generate-notes
          have=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for f in artifacts/*; do
            if grep -qxF "$(basename "$f")" <<< "$have"; then echo "kept $(basename "$f")"; else gh release upload "$TAG" "$f"; fi
          done
